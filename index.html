<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Precios — UTEL</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --accent: #1e3a5f;
    --accent2: #2563eb;
    --fg: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --err: #dc2626;
    --shadow: 0 4px 24px rgba(30,58,95,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 24px 16px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 40px 36px 36px;
    width: 100%;
    max-width: 400px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: .5px;
    flex-shrink: 0;
  }
  .logo-text { line-height: 1.2; }
  .logo-text strong { display: block; font-size: 15px; color: var(--accent); }
  .logo-text span { font-size: 12px; color: var(--muted); }
  h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 6px;
  }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 6px;
  }
  .input-wrap {
    position: relative;
    margin-bottom: 20px;
  }
  input[type=password] {
    width: 100%;
    padding: 11px 44px 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    color: var(--fg);
    outline: none;
    transition: border-color .15s;
  }
  input[type=password]:focus { border-color: var(--accent2); }
  .eye {
    position: absolute; right: 12px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    cursor: pointer; color: var(--muted);
    font-size: 16px; padding: 4px;
  }
  .btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .1s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:hover { background: var(--accent2); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err-msg {
    color: var(--err);
    font-size: 13px;
    margin-top: 10px;
    display: none;
    text-align: center;
  }
  .progress {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 16px;
    display: none;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent2);
    width: 0%;
    transition: width .3s;
    border-radius: 2px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">UTEL</div>
    <div class="logo-text">
      <strong>Propuestas Comerciales</strong>
      <span>Área de Marketing · México</span>
    </div>
  </div>
  <h1>Acceso restringido</h1>
  <p class="sub">Ingresá tu contraseña para continuar.</p>
  <label for="pwd">Contraseña</label>
  <div class="input-wrap">
    <input type="password" id="pwd" placeholder="••••••••••" autofocus autocomplete="current-password">
    <button class="eye" id="eyeBtn" type="button" title="Mostrar/ocultar">👁</button>
  </div>
  <button class="btn" id="loginBtn">
    <span id="btnTxt">Ingresar</span>
    <span class="spinner" id="spinner"></span>
  </button>
  <div class="err-msg" id="errMsg">Contraseña incorrecta. Intentá de nuevo.</div>
  <div class="progress" id="prog"><div class="progress-bar" id="progBar"></div></div>
</div>

<script>
// Parámetros de cifrado (deben coincidir con encrypt_calc.py)
const ITERATIONS = 200000;
const BLOB_PATH  = 'app.enc';

const $ = id => document.getElementById(id);

$('eyeBtn').onclick = () => {
  const el = $('pwd');
  el.type = el.type === 'password' ? 'text' : 'password';
};

$('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('loginBtn').onclick = doLogin;

async function doLogin() {
  const pwd = $('pwd').value.trim();
  if (!pwd) return;

  $('loginBtn').disabled = true;
  $('btnTxt').textContent = 'Descifrando…';
  $('spinner').style.display = 'inline-block';
  $('errMsg').style.display = 'none';
  $('prog').style.display = 'block';
  $('progBar').style.width = '20%';

  try {
    // Cargar blob cifrado
    const resp = await fetch(BLOB_PATH + '?v=' + Date.now());
    if (!resp.ok) throw new Error('No se pudo cargar el recurso.');
    const b64 = await resp.text();
    $('progBar').style.width = '40%';

    // Decodificar base64 → ArrayBuffer
    const raw    = Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0));
    const salt   = raw.slice(0, 16);
    const iv     = raw.slice(16, 28);
    const cipher = raw.slice(28);

    // Derivar clave
    const keyMaterial = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']
    );
    $('progBar').style.width = '60%';
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false, ['decrypt']
    );
    $('progBar').style.width = '80%';

    // Descifrar
    let decrypted;
    try {
      const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
      decrypted = new TextDecoder().decode(buf);
    } catch {
      throw new Error('WRONG_PASSWORD');
    }
    $('progBar').style.width = '100%';

    // Reemplazar documento con la app descifrada
    await new Promise(r => setTimeout(r, 150));
    document.open();
    document.write(decrypted);
    document.close();

  } catch (err) {
    $('loginBtn').disabled = false;
    $('btnTxt').textContent = 'Ingresar';
    $('spinner').style.display = 'none';
    $('prog').style.display = 'none';
    $('progBar').style.width = '0%';
    $('errMsg').style.display = 'block';
    if (err.message !== 'WRONG_PASSWORD') {
      $('errMsg').textContent = 'Error al cargar la aplicación. Recargá la página.';
      console.error(err);
    }
    $('pwd').select();
  }
}
</script>
</body>
</html>

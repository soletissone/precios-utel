<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gastos UTEL</title>
<meta name="theme-color" content="#06B706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos UTEL">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icono-512.png">
<link rel="icon" type="image/png" href="icono-256.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; color: #0F172A; font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 24px 16px; }
  .caja { max-width: 380px; width: 100%; text-align: center; }
  .caja img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(6,183,6,.3); }
  h1 { font-size: 22px; margin: 20px 0 6px; letter-spacing: -.02em; }
  p { color: #475569; font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
  a.btn { display: block; background: #058A05; color: #fff; text-decoration: none; font-weight: 600; padding: 14px; border-radius: 12px; font-size: 16px; }
  .tip { margin-top: 26px; text-align: left; background: #F8FAFC; border: 1px solid #E5E9F0; border-radius: 12px; padding: 14px 16px; font-size: 13px; color: #475569; }
  .tip b { color: #0F172A; }
  .tip ol { margin: 6px 0 0; padding-left: 18px; }
</style>
</head>
<body>
<div class="caja">
  <img src="icono-512.png" alt="UTEL">
  <h1>Rendición de gastos</h1>
  <p>Cargá tus gastos, comprobantes y anticipos. Entrá con tu cuenta de UTEL o S4Learning.</p>
  <a class="btn" id="entrar" href="https://script.google.com/a/macros/utel.edu.mx/s/AKfycbxOXe_x4m73Kq8SU0sJUy-QXNpECDA5MciSx1aVMq5qPuI9dHUZE3iKnsGjIa_XfMan/exec">Entrar</a>
  <div class="tip" id="tip">
    <b>Tenela a mano en el celu:</b>
    <ol>
      <li><b>iPhone (Safari):</b> botón Compartir → “Agregar a inicio”.</li>
      <li><b>Android (Chrome):</b> menú ⋮ → “Agregar a la pantalla principal” o “Instalar app”.</li>
    </ol>
  </div>
</div>
<script>
  var desdeInicio = /[?&]app=1/.test(location.search) || window.navigator.standalone ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (desdeInicio) {
    document.getElementById('tip').style.display = 'none';
    location.replace(document.getElementById('entrar').href);
  }
</script>
</body>
</html>
